name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. a force-push to a PR branch) so
# CI isn't wasting minutes on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependency/secret/misconfig gate. Trivy is pinned to the same version used
  # for the local verification; HIGH/CRITICAL findings fail the job. Dockerfile
  # misconfigs are included now that DS-0002 (agent image root user) is fixed,
  # so a regression is caught here as well as by the docker-build UID checks.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy HIGH/CRITICAL vulnerability, secret and misconfiguration scan
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            aquasec/trivy:0.76.2 fs \
            --severity HIGH,CRITICAL \
            --scanners vuln,secret,misconfig \
            --skip-dirs .git --skip-dirs node_modules \
            --skip-dirs .venv --skip-dirs .next \
            --no-progress \
            --exit-code 1 \
            /repo

  # Secret scan — fail on committed keys/tokens before building anything.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    env:
      # uv must not fall back to the runner's default Python (3.14): onnxruntime
      # 1.20.1 has no cp314 wheel. setup-python installs 3.11; UV_PYTHON keeps
      # every agent/lightrag uv command on it.
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pnpm
        # Version comes from package.json `packageManager` (pnpm@11.5.2).
        # Pinning it here too makes pnpm/action-setup error with
        # ERR_PNPM_BAD_PM_VERSION ("Multiple versions of pnpm specified").
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Install JS deps
        run: pnpm install

      - name: Check agent lockfile is fresh
        run: cd apps/agent && uv lock --check

      - name: Sync Python deps (agent)
        run: cd apps/agent && uv sync

      - name: Generate schema
        run: pnpm gen:schema

      - name: Schema is up to date
        run: git diff --exit-code packages/shared/schema

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (Vitest + pytest)
        run: pnpm test

      # WP-12: the knowledge sidecar has its own uv project + offline tests
      # (naive RAG backend); run them here so the full stack is covered in CI.
      - name: Check lightrag lockfile is fresh
        run: uv --directory services/lightrag lock --check

      - name: Test lightrag sidecar
        run: uv --directory services/lightrag run pytest

      - name: Validate docker compose
        # Profiled services are skipped unless their profile is named, so the
        # `local` (model servers) and `live` (voice worker) blocks need their own
        # pass or a typo in them would ship unvalidated.
        run: |
          docker compose config -q
          docker compose --profile local --profile live config -q

  # Actually BUILD the images so Dockerfile breakage (copy paths, --frozen
  # lockfile drift, the worker model-bake step) surfaces in CI, not at deploy.
  # No push — build-only validation, with a layer cache to keep it fast.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Four images, one of them the multi-GB worker (livekit + torch + baked
      # weights), must fit on the runner while buildkit holds their layers.
      # Drop the preinstalled toolchains this job never uses first.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Build agent API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agent/Dockerfile
          target: api
          push: false
          load: true
          tags: openinterview-agent-api:ci
          cache-from: type=gha,scope=agent-api
          cache-to: type=gha,mode=max,scope=agent-api

      # The worker is a separate stage (livekit extra + baked model weights) and
      # previously never built in CI, so its Dockerfile edits could rot unseen.
      - name: Build agent worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agent/Dockerfile
          target: worker
          push: false
          load: true
          tags: openinterview-agent-worker:ci
          cache-from: type=gha,scope=agent-worker
          cache-to: type=gha,mode=max,scope=agent-worker

      # The agent images run as `appuser` (uid 10001). A regression to root is
      # silent at build time, so assert the user on both loaded images.
      - name: Verify agent images run as non-root
        run: |
          set -euo pipefail
          for image in openinterview-agent-api:ci openinterview-agent-worker:ci; do
            uid="$(docker run --rm "$image" id -u)"
            if [ "$uid" != "10001" ]; then
              echo "$image runs as uid $uid, expected 10001" >&2
              exit 1
            fi
            echo "$image runs as uid $uid"
          done

      # Boot the non-root API, require /health, and prove the baked venv can
      # write a trace as the runtime user. Any `Permission denied` in the logs
      # fails the smoke.
      - name: Smoke-test agent API image
        run: |
          set -euo pipefail
          docker rm -f agent-api-smoke >/dev/null 2>&1 || true
          trap 'docker rm -f agent-api-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name agent-api-smoke -p 8000:8000 openinterview-agent-api:ci >/dev/null
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "Agent API health check failed" >&2
            docker logs agent-api-smoke >&2 || true
            exit 1
          fi
          if docker logs agent-api-smoke 2>&1 | grep -i "permission denied"; then
            echo "Agent API logged a permission error" >&2
            exit 1
          fi
          # Real trace write through the app tracing module, using the baked
          # venv directly (not `uv run`), then assert the JSONL file exists and
          # belongs to the runtime uid.
          trace_id="$(docker exec agent-api-smoke .venv/bin/python -c '
          from deepinterview_agent.core.tracing import add_event, start_trace

          with start_trace("ci-smoke") as trace_id:
              add_event("ci-smoke", {"ok": True})
          print(trace_id)
          ')"
          trace_file="/app/.deepinterview/traces/${trace_id}.jsonl"
          docker exec agent-api-smoke test -s "$trace_file"
          owner_uid="$(docker exec agent-api-smoke stat -c %u "$trace_file")"
          if [ "$owner_uid" != "10001" ]; then
            echo "Trace file $trace_file owned by uid $owner_uid, expected 10001" >&2
            exit 1
          fi
          docker exec agent-api-smoke grep -q "trace_start" "$trace_file"
          echo "Agent API healthy as uid $(docker exec agent-api-smoke id -u); trace $trace_file owned by uid $owner_uid"

      # No `uv run` here: the baked venv must work as-is and offline. Importing
      # the worker plus both plugins, pulling their files from the baked cache,
      # and loading the Silero VAD proves the weights are readable by appuser
      # with the network disabled.
      - name: Verify agent worker loads baked models offline as non-root
        run: |
          set -euo pipefail
          docker run --rm --network none -e HF_HUB_OFFLINE=1 \
            openinterview-agent-worker:ci \
            .venv/bin/python -c '
          import os

          import deepinterview_agent.worker
          from livekit.agents.plugin import Plugin
          from livekit.plugins import silero, turn_detector

          assert os.getuid() == 10001, os.getuid()
          for plugin in Plugin.registered_plugins:
              plugin.download_files()
          silero.VAD.load()
          print("worker import + offline model load ok as uid", os.getuid())
          '

      # The two real startup paths, against the same built image: the worker CLI
      # must come up offline (no weight or dependency fetch), and the compose/
      # CMD `uv run` path must import the worker with the network available.
      - name: Verify agent worker CLI starts offline
        run: |
          set -euo pipefail
          docker run --rm --network none -e HF_HUB_OFFLINE=1 \
            openinterview-agent-worker:ci \
            .venv/bin/python -m deepinterview_agent.worker --help

      - name: Verify agent worker `uv run` import with network
        run: |
          set -euo pipefail
          docker run --rm openinterview-agent-worker:ci \
            uv run python -c "import deepinterview_agent.worker, livekit.plugins.silero"

      - name: Build lightrag image
        uses: docker/build-push-action@v6
        with:
          context: ./services/lightrag
          push: false
          cache-from: type=gha,scope=lightrag
          cache-to: type=gha,mode=max,scope=lightrag

      # The web image builds the whole pnpm workspace, so a missing manifest in
      # the deps stage only surfaces here. Build args mirror the compose
      # defaults; they are static placeholders, never real secrets.
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: openinterview-web:ci
          build-args: |
            NEXT_PUBLIC_APP_URL=http://localhost:3000
            NEXT_PUBLIC_SITE_URL=http://localhost:3000
            NEXT_PUBLIC_SUPABASE_URL=
            NEXT_PUBLIC_SUPABASE_ANON_KEY=
            NEXT_PUBLIC_SENTRY_DSN=
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Smoke-test web image
        run: |
          set -euo pipefail
          docker rm -f web-smoke >/dev/null 2>&1 || true
          trap 'docker rm -f web-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name web-smoke -p 3000:3000 openinterview-web:ci
          for path in /api/health /; do
            ok=0
            for _ in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:3000${path}" >/dev/null; then
                ok=1
                break
              fi
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then
              echo "Smoke check failed for ${path}" >&2
              docker logs web-smoke >&2 || true
              exit 1
            fi
            echo "Smoke check passed for ${path}"
          done
          docker logs web-smoke | tail -20
