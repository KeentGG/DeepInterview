# Funding sources for OpenInterview.
#
# OpenInterview is Apache-2.0 open-source software. Sponsorships fund the voice
# infrastructure (LiveKit / STT / TTS / LLM) that makes free mock interviews
# possible. Uncomment and fill in a line once the corresponding account exists —
# leaving placeholder usernames active renders broken "Sponsor" buttons.
#
# Docs: https://docs.github.com/get-started/quickstart/customizing-your-repository

# github: [openinterview]                 # GitHub Sponsors username(s)
# open_collective: openinterview          # Open Collective slug
# patreon: openinterview                  # Patreon username
# ko_fi: openinterview                    # Ko-fi username
# liberapay: openinterview                # Liberapay username
# custom: ["https://github.com/KeentGG/OpenInterview"]  # Any other funding URL(s)
